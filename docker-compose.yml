version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduagent-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////data/eduagent.db
      - CHROMA_DB_PATH=/data/chroma_db
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_edu_agent_2026}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    volumes:
      - eduagent_data:/data
      - ./backend/uploads:/app/uploads
    expose:
      - "8000"
    networks:
      - eduagent-net

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # At build time, /api calls go through Nginx on the same origin (no host needed)
        NEXT_PUBLIC_API_URL: ""
    container_name: eduagent-frontend
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - eduagent-net
    depends_on:
      - backend

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: eduagent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - eduagent-net
    depends_on:
      - backend
      - frontend

# ── Named volume for persistent data ─────────────────────────────────────────
volumes:
  eduagent_data:
    name: eduagent_data

# ── Internal network ──────────────────────────────────────────────────────────
networks:
  eduagent-net:
    driver: bridge
